[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "netvision"
dynamic = ["version"]
description = "Visual network diagnostics for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "psutil>=6.1,<8",
    "cryptography>=43,<47",
]

[project.gui-scripts]
netvision = "netvision.app:main"

[tool.setuptools.packages.find]
include = ["netvision*"]

[tool.setuptools.dynamic]
version = {attr = "netvision.version.__version__"}

