[build-system]
requires = ["setuptools>=75", "maturin>=1.7,<2"]
build-backend = "setuptools.build_meta"

[project]
name = "netvision"
dynamic = ["version"]
description = "Visual network diagnostics for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "psutil>=6.1,<8",
    "cryptography>=43,<47",
]

[project.gui-scripts]
netvision = "netvision.app:main"

[tool.setuptools.packages.find]
include = ["netvision", "netvision.*"]

# Build the optional Rust extension from netvision_rs/ with:
# ..\.venv\Scripts\maturin.exe develop

[tool.setuptools.dynamic]
version = {attr = "netvision.version.__version__"}

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["backups", "release"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 9

[tool.black]
target-version = ["py311"]
line-length = 100
extend-exclude = "(^/backups/|^/release/)"


[tool.pytest.ini_options]
addopts = "--basetemp=.pytest-temp"
testpaths = ["tests"]
python_files = ["test_*.py"]
