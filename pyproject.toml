[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "netvision"
version = "0.8.0"
description = "Visual network diagnostics for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8,<7",
    "psutil>=6.1,<8",
]

[project.gui-scripts]
netvision = "netvision.app:main"

[tool.setuptools.packages.find]
include = ["netvision*"]

